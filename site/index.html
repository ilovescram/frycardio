<!doctype html>
<html>
	<head>
		<title>Frycardio</title>
		<style>
			body {
				font-family: sans-serif;
				background: #0f172a;
				color: white;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}
			input {
				padding: 10px;
				width: 300px;
			}
			button {
				padding: 10px;
			}
		</style>
	</head>
	<body>
		<div>
			<h1>Frycardio</h1>
			<input id="url" placeholder="Enter URL" />
			<button onclick="go()">Go</button>
		</div>

		<script>
			function go() {
				let url = document.getElementById("url").value;
				window.location.href = "https://" + url;
			}
		</script>
	</body>
</html>
